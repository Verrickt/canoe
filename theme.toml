
name = "canoe-revived"
license = "MIT"
licenselink = "https://github.com/Verrickt/canoe-revived/blob/master/LICENSE.md"
description = "A beautiful and powerful Material Design theme for Hugo (modernized for Hugo 0.146+ / 0.166+)"
homepage = "https://github.com/Verrickt/canoe-revived"
tags = ['blog', 'material design', 'responsive', 'dark mode', 'search']
features = [
  'table of contents',
  'waterfall layout',
  'syntax highlighting (built-in Chroma)',
  'built-in search (Fuse.js)',
  'KaTeX (opt-in via front matter)',
  'dark mode (auto + manual)',
  'responsive design',
  'admonition / video / music shortcodes'
]
min_version = "0.146.0"

[author]
  name = "Verrickt"
  homepage = "https://github.com/Verrickt"

[original_author]
  name = "Kevin Tan"
  homepage = "https://keyin.me"

