<div class="table-wrapper">
  <table{{ range $k, $v := .Attributes }} {{ printf "%s=%q" $k $v | safeHTMLAttr }}{{ end }}>
    {{- range .THead }}
    <thead>
      <tr>
        {{- range . }}
        <th{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>
          {{- .Text -}}
        </th>
        {{- end }}
      </tr>
    </thead>
    {{- end }}
    {{- with .TBody }}
    <tbody>
      {{- range . }}
      <tr>
        {{- range . }}
        <td{{ with .Alignment }} style="text-align: {{ . }}"{{ end }}>
          {{- .Text -}}
        </td>
        {{- end }}
      </tr>
      {{- end }}
    </tbody>
    {{- end }}
  </table>
</div>
